<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行政人事管理系统 · 十克</title>
<style>
:root{
  --ink:#14201B; --ink2:#4A5A54; --mute:#8A9691; --line:#E2E9E5;
  --dark:#0A4C3F; --mid:#146B57; --band:#F4F8F6; --page:#FFFFFF;
  --red:#B42318; --yel:#7A5E00; --yelbg:#FDF6DC; --gold:#B7791F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Helvetica Neue",sans-serif;
  color:var(--ink);background:#EEF2F0;font-size:13px;line-height:1.5;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff;
  padding:0 22px;height:56px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(10,76,63,.14)}
.brand{font-size:15px;font-weight:700;letter-spacing:1.2px;white-space:nowrap}
.brand em{font-style:normal;font-weight:400;font-size:11.5px;opacity:.62;margin-left:10px;letter-spacing:0}
.topbar .sp{flex:1}
.tlink{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.09);color:#fff;
  font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tlink:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:1460px;margin:0 auto;padding:18px 22px 60px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13px;font-weight:600;
  padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--dark);border-color:var(--dark);color:#fff}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;padding-bottom:2px}
.subtab{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12.5px;font-weight:600;
  padding:6px 14px;border-radius:20px;cursor:pointer;font-family:inherit}
.subtab.on{background:var(--mid);border-color:var(--mid);color:#fff}
.subpanel{display:none}.subpanel.on{display:block}
.hblink{margin-left:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);
  color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:16px;
  border:1px solid rgba(255,255,255,.22);white-space:nowrap}
.hblink:hover{background:rgba(255,255,255,.26)}
.dotbadge{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:5px;
  background:#D93025;color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;text-align:center;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.card .n{font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.card .l{font-size:11px;color:var(--mute);margin-top:3px;white-space:nowrap}
.card.gre .n{color:var(--mid)} .card.yel .n{color:var(--yel)} .card.red .n{color:var(--red)}
.note{background:var(--yelbg);border:1px solid #EFDFBA;border-radius:8px;padding:9px 14px;
  font-size:12px;color:var(--yel);margin-bottom:12px}
.note b{color:#5C4700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:6px;
  font-size:12.5px;padding:6px 9px;color:var(--ink);font-family:inherit;outline:none}
.filters input{width:150px}
.filters .cnt{margin-left:auto;font-size:12px;color:var(--mute)}
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px}
th{position:sticky;top:0;background:var(--dark);color:#fff;font-weight:600;padding:8px 10px;
  white-space:nowrap;text-align:left;font-size:12px;z-index:5}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--mid)}
th .arr{font-size:10px;opacity:.85;margin-left:3px}
td{padding:7px 10px;border-bottom:1px solid var(--band);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:#F6FAF8}
td.lft{text-align:left} td.num{text-align:right}
.pill{display:inline-block;padding:1.5px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.gre{background:#EDF3EF;color:#3F6B58}
.pill.yel{background:var(--yelbg);color:var(--yel)}
.pill.org{background:#FCE9D2;color:#A54A05}
.pill.red{background:#FBE4E1;color:#B42318}
.pill.blu{background:#E3EEF9;color:#2C5A8C}
.pill.gry{background:#EEF0EF;color:#6B7772}
.h2{font-size:14px;font-weight:700;margin:18px 0 10px;color:var(--dark)}
.h2row{display:flex;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.h2row .h2{margin:0;white-space:nowrap}
.h2search{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12.5px;
  padding:6px 10px;color:var(--ink);font-family:inherit;outline:none;width:190px}
.h2search:focus{border-color:var(--mid)}
.h2row .cnt{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.panel{display:none}.panel.on{display:block}
.ctframe{width:100%;height:calc(100vh - 152px);min-height:620px;border:1px solid var(--line);
  border-radius:10px;background:#fff;display:block}
@media(max-width:640px){.ctframe{height:calc(100dvh - 168px);min-height:520px;border-radius:8px}}
@media(max-width:640px){
  .topbar{padding:0 12px;gap:8px}
  .brand{font-size:13px;letter-spacing:.4px}
  .brand em{display:none}
  .hblink{margin-left:0;padding:5px 10px;font-size:11.5px}
  .wrap{padding:14px 12px 50px}
  .tabs{gap:6px}.tab{padding:7px 13px;font-size:12.5px}
  .subtabs{gap:5px}.subtab{padding:5px 11px;font-size:11.5px}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .card{min-width:0;padding:9px 10px}
  .card .n{font-size:18px}
  .card .l{white-space:normal;line-height:1.3}
  .tblwrap{max-width:100%}
  .h2row{gap:8px;margin:14px 0 8px}
  .h2row .h2search{width:100%;order:3}
  th,td{padding:7px 8px;font-size:12px}
}
.reason{white-space:normal;max-width:420px;color:var(--ink2)}
footer{margin-top:26px;font-size:11.5px;color:var(--mute);line-height:1.8}
footer a{color:var(--mid)}
@media (max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">十克 · 行政人事管理系统<em id="snap"></em></div>
  <div class="sp"></div>
  <a class="hblink" href="https://www.kdocs.cn/l/cgW8ad1WU7ad" target="_blank" rel="noopener" title="员工手册（2026 年 9 月生效正式版）">📖 员工手册</a>
</div>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-p="att">考勤<span id="attBadge" class="dotbadge" style="display:none"></span></button>
    <button class="tab" data-p="ct">合同台账</button>
  </div>

  <!-- ═══ 考勤（含：考勤汇总 / 请假明细 / 加班调休 / 异常情况 / 待办提醒）═══ -->
  <div class="panel on" id="p-att">
  <div class="subtabs">
    <button class="subtab on" data-sub="sum">考勤汇总</button>
    <button class="subtab" data-sub="leave">请假明细（2026）</button>
    <button class="subtab" data-sub="ot">加班调休</button>
    <button class="subtab" data-sub="anom">异常情况<span id="anomBadge" class="dotbadge" style="display:none"></span></button>
    <button class="subtab" data-sub="todo">待办提醒<span id="todoBadge" class="dotbadge" style="display:none"></span></button>
  </div>

  <!-- 考勤汇总 -->
  <div class="subpanel on" id="p-sum">
    <div class="cards" id="sumCards"></div>
    <div class="note">口径：<b>调休假 1 天 = 7 小时</b>（与汇总表公式一致）。</div>
    <div class="filters">
      <select id="fDept"></select>
      <input id="fName" placeholder="搜索姓名…">
      <span class="cnt" id="sumCnt"></span>
    </div>
    <div class="tblwrap"><table id="sumTbl"></table></div>
  </div>

  <!-- ═══ 请假明细 ═══ -->
  <div class="subpanel" id="p-leave">
    <div class="filters">
      <select id="lMon"></select>
      <select id="lType"></select>
      <select id="lDept"></select>
      <input id="lName" placeholder="搜索姓名…">
      <span class="cnt" id="lCnt"></span>
    </div>
    <div class="tblwrap"><table id="lTbl"></table></div>
  </div>

  <!-- ═══ 加班调休 ═══ -->
  <div class="subpanel" id="p-ot">
    <div class="cards" id="otCards"></div>
    <div class="note">单位：小时（h）。剩余天数按 <b>÷7</b> 换算，与考勤汇总页一致。</div>
    <div class="h2row">
      <div class="h2">每人汇总（按剩余排序）</div>
      <input id="oAggName" class="h2search" placeholder="搜索姓名 / 部门…">
      <span class="cnt" id="oAggCnt"></span>
    </div>
    <div class="tblwrap" style="max-height:46vh"><table id="otAggTbl"></table></div>
    <div class="h2row">
      <div class="h2">加班明细</div>
      <input id="oName" class="h2search" placeholder="搜索姓名 / 原因…">
      <span class="cnt" id="oCnt"></span>
    </div>
    <div class="tblwrap"><table id="oTbl"></table></div>
  </div>

  <!-- ═══ 异常情况 ═══ -->
  <div class="subpanel" id="p-anom">
    <div class="cards" id="anCards"></div>
    <div class="note" id="anNote"></div>
    <div class="filters">
      <select id="aType"></select>
      <select id="aDone">
        <option value="">全部状态</option>
        <option value="0">待处理</option>
        <option value="1">已处理</option>
      </select>
      <input id="aKw" placeholder="搜索姓名…">
      <span class="cnt" id="aCnt"></span>
    </div>
    <div class="tblwrap"><table id="aTbl"></table></div>
  </div>

  <!-- ═══ 待办提醒（周年 / 体检 / 病假）═══ -->
  <div class="subpanel" id="p-todo">
    <div class="cards" id="tdCards"></div>
    <div class="note" id="tdNote"></div>
    <div class="filters">
      <select id="tdType">
        <option value="">全部类型</option>
        <option value="周年">周年</option>
        <option value="年假">年假未休</option>
        <option value="体检">体检</option>
        <option value="病假">病假</option>
      </select>
      <select id="tdRange">
        <option value="30">30 天内</option>
        <option value="90" selected>90 天内</option>
        <option value="0">全部</option>
      </select>
      <input id="tdKw" placeholder="搜索姓名 / 部门…">
      <span class="cnt" id="tdCnt"></span>
    </div>
    <div class="tblwrap"><table id="tdTbl"></table></div>
  </div>

  </div><!-- /#p-att 考勤 -->

  <!-- ═══ 合同台账（整页模板内嵌）═══ -->
  <div class="panel" id="p-ct">
    <iframe id="ctFrame" class="ctframe" title="合同台账" loading="eager"></iframe>
  </div>

  <!-- 其它子表（由 extra_sheets.json 自动生成，见脚本末尾）-->
  <div id="extraPanels"></div>

  <footer>
    数据来源：金山文档《行政人事管理系统(在线).xlsx》—— 考勤汇总 / 考勤设置（明细）/ 加班调休 (明细) / 合同台账，
    以及在 Excel 里新增的其它子表（自动成 tab）。快照 <b><span id="snap2"></span></b>。<br>
    更新方式：在 Excel 里改完，跟小游说「<b>同步</b>」，即重新抓取全部子表并发布（链接不变，刷新就是最新）。
  </footer>
</div>

document.addEventListener("click", function(e){
  if(!e.target.closest) return;
  var st = e.target.closest(".subtab");
  if(st && st.dataset.sub){
    document.querySelectorAll(".subtab").forEach(function(x){x.classList.toggle("on",x===st)});
    document.querySelectorAll(".subpanel").forEach(function(p){p.classList.toggle("on",p.id==="p-"+st.dataset.sub)});
    return;
  }
  var t = e.target.closest(".tab");
  if(!t || !t.dataset.p) return;
  document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===t)});
  document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("on",p.id==="p-"+t.dataset.p)});
});

/* ── 通用：可排序表 ── */
function sortTbl(tbl, cols, rows, render){
  var st = {k:null, dir:1};
  var thead = "<tr>" + cols.map(function(c,i){
    return '<th class="sortable" data-i="'+i+'">'+c.t+'<span class="arr"></span></th>';
  }).join("") + "</tr>";
  function draw(){
    var body = rows.slice();
    if(st.k!==null){
      body.sort(function(a,b){
        var x=a[st.k], y=b[st.k];
        var nx=parseFloat(x), ny=parseFloat(y);
        if(!isNaN(nx)&&!isNaN(ny)&&(typeof x==="number"||typeof y==="number"||String(x).match(/[\d.]/))){x=nx;y=ny;}
        else {x=String(x==null?"":x);y=String(y==null?"":y);}
        return (x<y?-1:x>y?1:0)*st.dir;
      });
    }
    tbl.innerHTML = "<thead>" + thead + "</thead><tbody>" + body.map(render).join("") + "</tbody>";
    tbl.querySelectorAll("th").forEach(function(th){
      th.addEventListener("click",function(){
        var i=+th.dataset.i;
        if(st.k===i) st.dir*=-1; else {st.k=i;st.dir=1;}
        tbl.querySelectorAll(".arr").forEach(function(a){a.textContent=""});
        th.querySelector(".arr").textContent = st.dir>0?"▲":"▼";
        draw();
      });
    });
  }
  draw();
  return function(){ st.k=null; st.dir=1; draw(); };
}

/* 入职周期：由入职日期实时计算（公式化，不用 Excel 的静态文本） */
function tenureOf(hire, fallback){
  if(!hire) return fallback || "–";
  var p = String(hire).split(/[\/\-.]/);
  if(p.length < 3) return fallback || "–";
  var h = new Date(+p[0], +p[1]-1, +p[2]);
  if(isNaN(h.getTime())) return fallback || "–";
  var t = new Date();
  var y = t.getFullYear()-h.getFullYear(), m = t.getMonth()-h.getMonth(), d = t.getDate()-h.getDate();
  if(d < 0){ m--; d += new Date(t.getFullYear(), t.getMonth(), 0).getDate(); }
  if(m < 0){ y--; m += 12; }
  if(y < 0) return "未入职";
  return y+"年"+m+"个月"+d+"天";
}

/* ── 待办提醒（周年 / 体检 / 病假）· 全部按「今天」实时计算，刷新即更新 ── */
(function(){
  var T = D.todo || {staff:[], sick:[], sick_limit:20, exam_min_years:2};
  var EXAM_MIN = T.exam_min_years || 2;

  /* ===== 日期工具（等价于 Excel 的 DATEDIF / EDATE）===== */
  function parseD(s){
    if(!s) return null;
    var m = String(s).match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/);
    if(!m) return null;
    var d = new Date(+m[1], +m[2]-1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  function addYears(d, n){
    var y = d.getFullYear()+n, mo = d.getMonth(), day = d.getDate();
    var t = new Date(y, mo, day);
    if(t.getMonth() !== mo) t = new Date(y, mo+1, 0);   /* 2/29 → 该月最后一天 */
    return t;
  }
  function ymd(a, b){
    var y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();
    if(d<0){ m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
    if(m<0){ y--; m+=12; }
    return [y,m,d];
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function fmtCN(d){ return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"; }
  function fmt(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function daysBetween(a, b){
    var x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    var y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((y-x)/86400000);
  }
  var TODAY = new Date();
  TODAY = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());

  /* 里程碑 → 应做事项 */
  function actionFor(y){
    if(y===1)  return ["增加年假",        "满 1 年 → 备注提醒：增加年假"];
    if(y===2)  return ["安排体检",        "满 2 年 → 安排员工体检"];
    if(y===3)  return ["安排 3 天带薪福利假", "满 3 年 → 安排 3 天带薪福利假"];
    if(y===4)  return ["仅提醒",          "满 4 年 → 仅提醒（暂不调整福利）"];
    if(y===5)  return ["安排 5 天福利假",   "满 5 年 → 安排 5 天福利假"];
    if(y===10) return ["安排 8 天带薪福利假", "满 10 年 → 安排 8 天带薪福利假"];
    return ["常规周年提醒", "满 "+y+" 年 → 常规周年提醒"];
  }

  /* ===== 现场计算：每人下一次周年 + 剩余天数 ===== */
  var items = [];
  (T.staff||[]).forEach(function(p){
    var hire = parseD(p.hire);
    if(!hire || hire > TODAY) return;
    var a = ymd(hire, TODAY), yearsDone = a[0];
    var tenure = a[0]+"年"+a[1]+"个月"+a[2]+"天";
    var next, target;
    if(addYears(hire, yearsDone).getTime() === TODAY.getTime()){
      next = TODAY; target = yearsDone;               /* 今天就是周年当天 */
    }else{
      target = yearsDone + 1; next = addYears(hire, target);
    }
    var dt = daysBetween(TODAY, next);
    var act = actionFor(target);
    items.push({k:"周年", id:"a|"+p.name+"|"+fmt(next), name:p.name, dept:p.dept||"",
      date:fmtCN(next), days:dt, years:target, tenure:tenure,
      title:act[0], label:act[1], hire:fmt(hire), exam:p.exam||""});

    /* 年假余额（当年）：12/31 前未休完 → 待办，带到期倒计时 */
    if((p.annual || 0) > 0.02){
      var dl = new Date(TODAY.getFullYear(), 11, 31);
      items.push({k:"年假", id:"l|"+p.name+"|"+TODAY.getFullYear(), name:p.name, dept:p.dept||"",
        date:fmtCN(dl), days:daysBetween(TODAY, dl), years:null, tenure:tenure,
        hire:fmt(hire), annual:p.annual,
        title:"年假余额 "+p.annual+" 天未休（"+fmtCN(dl)+" 清零）",
        label:"当年年假余额 "+p.annual+" 天，请在 12 月 31 日前休完", exam:p.exam||""});
    }

    /* 体检：满 EXAM_MIN 年该做体检；未安排 → 到期日 ≤ 90 天内都提示
       （已过到期日 = 过时 → 显示「即刻」；还没到但 ≤90 天 → 显示日期 +（即将逾期）） */
    if((p.exam||"")==="未安排"){
      var due = addYears(hire, EXAM_MIN);
      var dDue = daysBetween(TODAY, due);
      if(dDue <= 90){
        var dateTxt = dDue <= 0 ? "即刻" : fmtCN(due)+"（即将逾期）";
        var label = dDue <= 0
          ? "体检已过时（"+fmtCN(due)+" 起就该安排），请即刻安排"
          : fmtCN(due)+" 满 "+EXAM_MIN+" 年，体检需提前安排（即将逾期）";
        items.push({k:"体检", id:"e|"+p.name, name:p.name, dept:p.dept||"", date:dateTxt,
          days:dDue, years:EXAM_MIN, tenure:tenure, hire:fmt(hire),
          title:"安排员工体检", label:label, exam:p.exam||""});
      }
    }
  });

  (T.sick||[]).forEach(function(x){
    items.push({k:"病假", id:"s|"+x.name, name:x.name, dept:x.dept||"", date:"", days:null,
      years:null, tenure:"", hire:"", title:"病假累计 "+x.days+" 天（≥"+(T.sick_limit||20)+" 天）",
      label:"当年累计病假已达上限，注意后续待遇与沟通", exam:""});

  function saveDone(){ try{ localStorage.setItem(K, JSON.stringify(done)); }catch(e){} }

  var tdType=document.getElementById("tdType"), tdRange=document.getElementById("tdRange"),
      tdKw=document.getElementById("tdKw");

  function badge(){
    var n = items.filter(function(x){
      if(done[x.id]) return false;
      if(x.k==="周年") return x.days!=null && x.days<=90;
      return true;
    }).length;
    var b=document.getElementById("todoBadge");
    if(b){ b.textContent = n ? n : ""; b.style.display = n ? "inline-block" : "none"; }
    if(window.refreshAttBadge) window.refreshAttBadge();
  }

  var cols=[{t:"已完成"},{t:"类型"},{t:"姓名"},{t:"部门"},{t:"已满年限"},{t:"安排日期"},{t:"剩余天数"},{t:"应做事项"}];

  function draw(){
    var ty=tdType.value, rg=+tdRange.value, kw=(tdKw.value||"").trim();
    var rows = items.filter(function(x){
      if(ty && x.k!==ty) return false;
      if(rg && (x.k==="周年" || x.k==="年假") && x.days!=null && x.days>=0 && x.days>rg) return false;
      if(kw && (x.name+" "+x.dept).indexOf(kw)<0) return false;
      return true;
    }).sort(function(a,b){
      var da=a.days==null?99999:a.days, db=b.days==null?99999:b.days;
      if(da!==db) return da-db;
      if(a.k==="年假" && b.k==="年假") return (b.annual||0)-(a.annual||0);  /* 余额多的先提醒 */
      return String(a.name).localeCompare(String(b.name),"zh");
    });

    document.getElementById("tdCnt").textContent =
      "共 "+rows.length+" 项（未完成 "+rows.filter(function(x){return !done[x.id]}).length+"）";
    sortTbl(document.getElementById("tdTbl"), cols, rows.map(function(x){
      return [done[x.id]?"1":"", x.k, x.name, x.dept||"", (x.years!=null? "满 "+x.years+" 年":"–"),
              x.date||"–", x.days, (x.k==="周年"? (x.label||x.title) : x.title)];
    }), function(r){
      return "<tr><td><input type='checkbox' style='cursor:pointer' "+(r[0]?"checked":"")+"></td>"+
        "<td><span class='pill "+(TYPE_PILL[r[1]]||"gry")+"'>"+esc(r[1])+"</span></td>"+
        "<td class='lft'><b>"+esc(r[2])+"</b></td><td>"+esc(r[3])+"</td><td>"+esc(r[4])+"</td>"+
        "<td class='gry'>"+esc(r[5])+"</td>"+
        "<td class='num'>"+(r[6]==null?"–":(r[6]<0?"<b style='color:var(--red)'>逾期 "+(-r[6])+" 天</b>":(r[6]===0?"<b style='color:var(--red)'>今天</b>":r[6]+" 天")))+"</td>"+
        "<td class='lft reason'>"+esc(r[7])+"</td></tr>";
    });

    document.querySelectorAll("#tdTbl tbody tr").forEach(function(tr, i){
      var cb = tr.querySelector("input[type=checkbox]");
      if(!cb) return;
      cb.addEventListener("change", function(){
        var id = rows[i].id;
        if(cb.checked) done[id] = 1; else delete done[id];
        saveDone(); draw(); badge();
      });
    });
  }

  var c30=items.filter(function(x){return x.k==="周年"&&x.days<=30}).length;
  var c90=items.filter(function(x){return x.k==="周年"&&x.days<=90}).length;
  var cn=items.filter(function(x){return x.k==="体检"}).length;
  var cl=items.filter(function(x){return x.k==="年假"}).length;
  var cs=items.filter(function(x){return x.k==="病假"}).length;
  document.getElementById("tdCards").innerHTML = [
    {n:c30, l:"30 天内周年", c:"red"},
    {n:c90, l:"90 天内周年", c:"yel"},
    {n:cl,  l:"年假未休（12/31）", c:"gre"},
    {n:cn,  l:"满"+EXAM_MIN+"年待体检", c:"org"},
    {n:cs,  l:"病假≥"+(T.sick_limit||20)+"天", c:"red"},
    {n:items.filter(function(x){return x.k==="周年"}).length, l:"在职周年记录", c:"gre"}
  ].map(function(x){return '<div class="card '+x.c+'"><div class="n">'+x.n+'</div><div class="l">'+x.l+'</div></div>'}).join("");

  document.getElementById("tdNote").innerHTML =
    "周年与剩余天数按<b>入职日期</b>实时计算（打开/刷新页面即按当天重算）。满1年→增加年假；"+
    "满2年→安排体检；满3年→3天带薪福利假；满4年→仅提醒；满5年→5天福利假；满10年→8天带薪福利假。"+
    "体检：满 "+EXAM_MIN+" 年且「未安排」→ 单独提醒。病假当年累计满 "+(T.sick_limit||20)+" 天 → 提醒。"+
    "<b>年假余额（当年）</b>：12 月 31 日到期，未休完的一律列出并显示距清零天数（免管名单已剔除）。";

  [tdType, tdRange].forEach(function(el){ el.addEventListener("change", draw); });
  tdKw.addEventListener("input", draw);
  draw(); badge();
})();
