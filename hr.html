<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行政人事管理系统 · 十克</title>
<style>
:root{
  --ink:#14201B; --ink2:#4A5A54; --mute:#8A9691; --line:#E2E9E5;
  --dark:#0A4C3F; --mid:#146B57; --band:#F4F8F6; --page:#FFFFFF;
  --red:#B42318; --yel:#7A5E00; --yelbg:#FDF6DC; --gold:#B7791F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Helvetica Neue",sans-serif;
  color:var(--ink);background:#EEF2F0;font-size:13px;line-height:1.5;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff;
  padding:0 22px;height:56px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(10,76,63,.14)}
.brand{font-size:15px;font-weight:700;letter-spacing:1.2px;white-space:nowrap}
.brand em{font-style:normal;font-weight:400;font-size:11.5px;opacity:.62;margin-left:10px;letter-spacing:0}
.topbar .sp{flex:1}
.tlink{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.09);color:#fff;
  font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.tlink:hover{background:rgba(255,255,255,.2)}
.wrap{max-width:1460px;margin:0 auto;padding:18px 22px 60px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:13px;font-weight:600;
  padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--dark);border-color:var(--dark);color:#fff}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.card .n{font-size:21px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.card .l{font-size:11px;color:var(--mute);margin-top:3px;white-space:nowrap}
.card.gre .n{color:var(--mid)} .card.yel .n{color:var(--yel)} .card.red .n{color:var(--red)}
.note{background:var(--yelbg);border:1px solid #EFDFBA;border-radius:8px;padding:9px 14px;
  font-size:12px;color:var(--yel);margin-bottom:12px}
.note b{color:#5C4700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:6px;
  font-size:12.5px;padding:6px 9px;color:var(--ink);font-family:inherit;outline:none}
.filters input{width:150px}
.filters .cnt{margin-left:auto;font-size:12px;color:var(--mute)}
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px}
th{position:sticky;top:0;background:var(--dark);color:#fff;font-weight:600;padding:8px 10px;
  white-space:nowrap;text-align:left;font-size:12px;z-index:5}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--mid)}
th .arr{font-size:10px;opacity:.85;margin-left:3px}
td{padding:7px 10px;border-bottom:1px solid var(--band);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:hover td{background:#F6FAF8}
td.lft{text-align:left} td.num{text-align:right}
.pill{display:inline-block;padding:1.5px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.gre{background:#EDF3EF;color:#3F6B58}
.pill.yel{background:var(--yelbg);color:var(--yel)}
.pill.org{background:#FCE9D2;color:#A54A05}
.pill.red{background:#FBE4E1;color:#B42318}
.pill.blu{background:#E3EEF9;color:#2C5A8C}
.pill.gry{background:#EEF0EF;color:#6B7772}
.h2{font-size:14px;font-weight:700;margin:18px 0 10px;color:var(--dark)}
.panel{display:none}.panel.on{display:block}
.reason{white-space:normal;max-width:420px;color:var(--ink2)}
footer{margin-top:26px;font-size:11.5px;color:var(--mute);line-height:1.8}
footer a{color:var(--mid)}
@media (max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">十克 · 行政人事管理系统<em id="snap"></em></div>
  <div class="sp"></div>
</div>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-p="sum">考勤汇总</button>
    <button class="tab" data-p="leave">请假明细（2026）</button>
    <button class="tab" data-p="ot">加班调休</button>
    <button class="tab" data-p="anom">异常情况<span id="anomBadge" style="display:none"></span></button>
    <button class="tab" data-p="ct">合同台账</button>
  </div>

  <!-- ═══ 考勤汇总 ═══ -->
  <div class="panel on" id="p-sum">
    <div class="cards" id="sumCards"></div>
    <div class="note">口径：<b>调休假 1 天 = 7 小时</b>（与汇总表公式一致）。</div>
    <div class="filters">
      <select id="fDept"></select>
      <input id="fName" placeholder="搜索姓名…">
      <span class="cnt" id="sumCnt"></span>
    </div>
    <div class="tblwrap"><table id="sumTbl"></table></div>
  </div>

  <!-- ═══ 请假明细 ═══ -->
  <div class="panel" id="p-leave">
    <div class="filters">
      <select id="lMon"></select>
      <select id="lType"></select>
      <select id="lDept"></select>
      <input id="lName" placeholder="搜索姓名…">
      <span class="cnt" id="lCnt"></span>
    </div>
    <div class="tblwrap"><table id="lTbl"></table></div>
  </div>

  <!-- ═══ 加班调休 ═══ -->
  <div class="panel" id="p-ot">
    <div class="cards" id="otCards"></div>
    <div class="note">单位：小时（h）。剩余天数按 <b>÷7</b> 换算，与考勤汇总页一致。</div>
    <div class="h2">每人汇总（按剩余排序）</div>
    <div class="tblwrap" style="max-height:46vh"><table id="otAggTbl"></table></div>
    <div class="h2">加班明细</div>
    <div class="filters">
      <input id="oName" placeholder="搜索姓名…">
      <span class="cnt" id="oCnt"></span>
    </div>
    <div class="tblwrap"><table id="oTbl"></table></div>
  </div>

  <!-- ═══ 异常情况 ═══ -->
  <div class="panel" id="p-anom">
    <div class="cards" id="anCards"></div>
    <div class="note" id="anNote"></div>
    <div class="filters">
      <select id="aType"></select>
      <select id="aDone">
        <option value="">全部状态</option>
        <option value="0">待处理</option>
        <option value="1">已处理</option>
      </select>
      <input id="aKw" placeholder="搜索姓名…">
      <span class="cnt" id="aCnt"></span>
    </div>
    <div class="tblwrap"><table id="aTbl"></table></div>
  </div>

  <!-- ═══ 合同台账 ═══ -->
  <div class="panel" id="p-ct">
    <div class="cards" id="ctCards"></div>
    <div class="note" id="ctNote"></div>
    <div class="filters">
      <select id="cZone"></select>
      <select id="cStatus"></select>
      <select id="cBrand"></select>
      <input id="cKw" placeholder="搜索合同名 / 对方单位 / 编号…">
      <span class="cnt" id="cCnt"></span>
    </div>
    <div class="tblwrap"><table id="cTbl"></table></div>
  </div>

  <footer>
    数据来源：《行政人事管理系统(在线)》· 考勤汇总 / 考勤设置（明细）/ 加班调休 (明细) 三个 sheet 的快照。<br>
    更新方式：Excel 里手动登记后，把新文件发给小游重新生成发布即可（链接不变，刷新就是最新）。
  </footer>
</div>

/* ── 通用：可排序表 ── */
function sortTbl(tbl, cols, rows, render){
  var st = {k:null, dir:1};
  var thead = "<tr>" + cols.map(function(c,i){
    return '<th class="sortable" data-i="'+i+'">'+c.t+'<span class="arr"></span></th>';
  }).join("") + "</tr>";
  function draw(){
    var body = rows.slice();
    if(st.k!==null){
      body.sort(function(a,b){
        var x=a[st.k], y=b[st.k];
        var nx=parseFloat(x), ny=parseFloat(y);
        if(!isNaN(nx)&&!isNaN(ny)&&(typeof x==="number"||typeof y==="number"||String(x).match(/[\d.]/))){x=nx;y=ny;}
        else {x=String(x==null?"":x);y=String(y==null?"":y);}
        return (x<y?-1:x>y?1:0)*st.dir;
      });
    }
    tbl.innerHTML = thead + "<tbody>" + body.map(render).join("") + "</tbody>";
    tbl.querySelectorAll("th").forEach(function(th){
      th.addEventListener("click",function(){
        var i=+th.dataset.i;
        if(st.k===i) st.dir*=-1; else {st.k=i;st.dir=1;}
        tbl.querySelectorAll(".arr").forEach(function(a){a.textContent=""});
        th.querySelector(".arr").textContent = st.dir>0?"▲":"▼";
        draw();
      });
    });
  }
  draw();
  return function(){ st.k=null; st.dir=1; draw(); };
}

  document.getElementById("sumCnt").textContent = "共 "+rows.length+" 人";
  sortTbl(document.getElementById("sumTbl"), sumCols, rows.map(function(x){
    return [x.name,x.dept,x.tenure,x.total,x.annual,x.paid,x.child,x.paternity,x.sick,x.prenatal,x.tx_day,x.tx_day*7];
  }), function(r){
    return "<tr><td class='lft'><b>"+esc(r[0])+"</b></td><td>"+esc(r[1])+"</td><td>"+esc(r[2])+
    "</td><td class='num'><b>"+N(r[3])+"</b></td><td class='num'>"+N(r[4])+"</td><td class='num'>"+N(r[5])+
    "</td><td class='num'>"+N(r[6])+"</td><td class='num'>"+N(r[7])+"</td><td class='num'>"+N(r[8])+
    "</td><td class='num'>"+N(r[9])+"</td><td class='num'>"+N(r[10])+" 天 <span style='color:#8A9691'>("+N(r[11])+"h)</span></td></tr>";
  });
}
fDept.addEventListener("change",drawSummary);
document.getElementById("fName").addEventListener("input",drawSummary);

var totTx = sum(D.overtime,"left");
document.getElementById("sumCards").innerHTML = [
  {n:D.summary.length, l:"在册人员（汇总表）", c:""},
  {n:N(sum(D.summary,"total")), l:"剩余假期总额合计（天）", c:"gre"},
  {n:N(sum(D.summary,"annual")), l:"年假余额合计（天）", c:"gre"},
  {n:N(totTx/7)+" 天", l:"调休剩余合计（"+N(totTx)+" 小时）", c:"yel"},
  {n:N(sum(D.summary,"sick")), l:"病假合计（天）", c:""},
  {n:N(sum(D.summary,"prenatal")+sum(D.summary,"child")+sum(D.summary,"paternity")), l:"产检+育儿+陪产合计", c:""}
].map(function(c){return '<div class="card '+c.c+'"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>'}).join("");
drawSummary();

/* ── 请假明细 ── */
var lMon=document.getElementById("lMon"), lType=document.getElementById("lType"), lDept=document.getElementById("lDept");
function fill(sel, arr, allLabel){
  sel.innerHTML = '<option value="">'+allLabel+'</option>' + arr.map(function(v){return '<option>'+esc(v)+'</option>'}).join("");
}
var mons=[...new Set(D.leaves.map(function(x){return x.month}).filter(Boolean))].sort();
var types=[...new Set(D.leaves.map(function(x){return x.type}).filter(Boolean))];
fill(lMon,mons,"全部月份"); fill(lType,types,"全部类型"); fill(lDept,depts,"全部部门");
var TYPE_CLS = {"年":"gre","事":"org","病":"red","婚":"blu","产":"blu","丧":"gry","调":"yel"};
function typePill(t){
  if(!t) return "";
  var key = t.charAt(0), cls = TYPE_CLS[key]||"gry";
  return '<span class="pill '+cls+'">'+esc(t)+'</span>';
}
var lCols=[{t:"所属月份"},{t:"姓名"},{t:"部门"},{t:"开始"},{t:"结束"},{t:"天数"},{t:"类型"},{t:"原因"}];
function drawLeaves(){
  var m=lMon.value, tp=lType.value, dp=lDept.value, kw=document.getElementById("lName").value.trim();
  var rows=D.leaves.filter(function(x){
    return (!m||x.month===m)&&(!tp||x.type===tp)&&(!dp||x.dept===dp)&&(!kw||x.name.indexOf(kw)>=0);
  });
  document.getElementById("lCnt").textContent="共 "+rows.length+" 条 · 合计 "+N(sum(rows,"days"))+" 天";
  sortTbl(document.getElementById("lTbl"), lCols, rows.map(function(x){
    return [x.month,x.name,x.dept,x.start,x.end,x.days,x.type,x.reason];
  }), function(r){
    return "<tr><td>"+esc(r[0])+"</td><td class='lft'><b>"+esc(r[1])+"</b></td><td>"+esc(r[2])+
    "</td><td>"+esc(r[3])+"</td><td>"+esc(r[4])+"</td><td class='num'><b>"+N(r[5])+"</b></td><td>"+typePill(r[6])+
    "</td><td class='lft reason'>"+esc(r[7])+"</td></tr>";
  });
}
[lMon,lType,lDept].forEach(function(s){s.addEventListener("change",drawLeaves)});
document.getElementById("lName").addEventListener("input",drawLeaves);
drawLeaves();

/* ── 加班调休 ── */
var agg = {};
D.overtime.forEach(function(x){
  var a=agg[x.name] || (agg[x.name]={dept:x.dept,total:0,used:0,left:0});
  a.total+=+x.total||0; a.used+=+x.used||0; a.left+=+x.left||0;
});
var aggRows=Object.keys(agg).map(function(k){return {name:k,dept:agg[k].dept,total:agg[k].total,used:agg[k].used,left:agg[k].left}})
  .sort(function(a,b){return b.left-a.left});
document.getElementById("otCards").innerHTML=[
  {n:N(sum(D.overtime,"total"))+" h",l:"加班总时长",c:""},
  {n:N(sum(D.overtime,"used"))+" h",l:"已使用调休",c:"org"},
  {n:N(totTx)+" h",l:"剩余调休（="+N(totTx/7)+" 天）",c:"gre"},
  {n:aggRows.filter(function(r){return r.left>0}).length+" 人",l:"还有剩余调休",c:"yel"},
  {n:D.overtime.length,l:"加班记录条数",c:""}
].map(function(c){return '<div class="card '+c.c+'"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>'}).join("");

var aggCols=[{t:"姓名"},{t:"部门"},{t:"加班总(h)"},{t:"已使用(h)"},{t:"剩余(h)"},{t:"剩余(天)"}];
sortTbl(document.getElementById("otAggTbl"), aggCols, aggRows.map(function(x){
  return [x.name,x.dept,x.total,x.used,x.left,x.left/7];
}), function(r){
  var lv = r[4]>0?'<span class="pill '+(r[4]>=14?'org':r[4]>=7?'yel':'gre')+'">'+N(r[4])+' h</span>':'–';
  return "<tr><td class='lft'><b>"+esc(r[0])+"</b></td><td>"+esc(r[1])+"</td><td class='num'>"+N(r[2])+
  "</td><td class='num'>"+N(r[3])+"</td><td class='num'>"+lv+"</td><td class='num'>"+N(r[5])+"</td></tr>";
});

var oCols=[{t:"姓名"},{t:"部门"},{t:"开始"},{t:"结束"},{t:"加班原因"},{t:"对应调休时间"},{t:"总时长(h)"},{t:"已用(h)"},{t:"剩余(h)"}];
function drawOT(){
  var kw=document.getElementById("oName").value.trim();
  var rows=D.overtime.filter(function(x){return !kw||x.name.indexOf(kw)>=0});
  document.getElementById("oCnt").textContent="共 "+rows.length+" 条 · 剩余合计 "+N(sum(rows,"left"))+" h";
  sortTbl(document.getElementById("oTbl"), oCols, rows.map(function(x){
    return [x.name,x.dept,x.start,x.end,x.reason,x.comp,x.total,x.used,x.left];
  }), function(r){
    return "<tr><td class='lft'><b>"+esc(r[0])+"</b></td><td>"+esc(r[1])+"</td><td>"+esc(r[2])+"</td><td>"+esc(r[3])+
    "</td><td class='lft reason'>"+esc(r[4])+"</td><td>"+esc(r[5])+"</td><td class='num'>"+N(r[6])+
    "</td><td class='num'>"+N(r[7])+"</td><td class='num'>"+(r[8]?"<b>"+N(r[8])+"</b>":"–")+"</td></tr>";
  });
}
document.getElementById("oName").addEventListener("input",drawOT);
drawOT();

/* ── 异常情况 ── */
if(D.anomaly){
  var A=D.anomaly.items, DONE_KEY="anom_done_"+D.anomaly.snapshot;
  var done={}; try{ done=JSON.parse(localStorage.getItem(DONE_KEY)||"{}") }catch(e){}
  function saveDone(){ try{ localStorage.setItem(DONE_KEY, JSON.stringify(done)) }catch(e){} }
  document.getElementById("anNote").innerHTML =
    "核对快照 <b>"+D.anomaly.snapshot+"</b>（飞书后台 vs Excel 台账）。勾选「已处理」只存在你自己的浏览器里，换设备/清缓存会重置；真正处理完的异常会在下次核对数据更新后消失。丧假按要求未核对。";
  var byType={}; A.forEach(function(x){ byType[x.type]=(byType[x.type]||0)+1 });
  var pending=A.filter(function(x){return !done[x.name+"|"+x.type]}).length;
  var badge=document.getElementById("anomBadge");
  if(pending){ badge.style.display="inline-block"; badge.style.cssText+=";margin-left:6px;background:#B42318;color:#fff;font-size:10.5px;padding:1px 7px;border-radius:9px;vertical-align:1px"; badge.textContent=pending; }
  document.getElementById("anCards").innerHTML=[
    {n:pending,l:"待处理",c:"red"},
    {n:byType["调休"]||0,l:"调休差异",c:"red"},
    {n:(byType["育儿假"]||0)+(byType["陪产假"]||0),l:"育儿/陪产差异",c:"yel"},
    {n:byType["年假"]||0,l:"年假差异（多为口径）",c:"yel"},
    {n:byType["名单"]||0,l:"名单问题",c:"red"}
  ].map(function(c){return '<div class="card '+c.c+'"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>'}).join("");

  var aType=document.getElementById("aType");
  fill(aType, Object.keys(byType), "全部类型");
  var TYPE_CLS2={"调休":"red","育儿假":"blu","陪产假":"blu","年假":"yel","名单":"org"};
  function deltaTxt(x){ if(x.delta===null||x.delta===undefined) return "–";
    return '<span class="'+(x.delta>0?'pos':'neg')+'">'+(x.delta>0?"+":"")+N(x.delta)+'</span>'; }
  var aCols=[{t:"✓"},{t:"姓名"},{t:"类别"},{t:"Excel"},{t:"飞书"},{t:"差额"},{t:"说明 / 处理建议"}];
  function drawAnom(){
    var tp=aType.value, dv=document.getElementById("aDone").value, kw=document.getElementById("aKw").value.trim();
    var rows=A.filter(function(x,i){
      if(tp&&x.type!==tp) return false;
      var isDone=!!done[x.name+"|"+x.type];
      if(dv==="0"&&isDone) return false;
      if(dv==="1"&&!isDone) return false;
      if(kw&&x.name.indexOf(kw)<0) return false;
      return true;
    }).sort(function(a,b){
      if(a.name!==b.name) return a.name.localeCompare(b.name,"zh");
      return (a.type||"").localeCompare(b.type||"","zh");
    });
    document.getElementById("aCnt").textContent="共 "+rows.length+" 条 · 待处理 "+pending;
    var tbl=document.getElementById("aTbl");
    tbl.innerHTML="<thead><tr>"+aCols.map(function(c){return "<th>"+c.t+"</th>"}).join("")+"</tr></thead><tbody>"+
      rows.map(function(x){
        var k=x.name+"|"+x.type, isDone=!!done[k];
        var sevBg = x.sev==="high"&&!isDone?" style='background:#FBE4E1'":"";
        return "<tr"+sevBg+"><td style='text-align:center'><input type='checkbox' data-k='"+esc(k)+"'"+(isDone?" checked":"")+
        " style='width:15px;height:15px;cursor:pointer;accent-color:var(--mid)'></td>"+
        "<td class='lft'><b>"+esc(x.name)+"</b>"+(isDone?' <span class="pill gre">已处理</span>':"")+"</td>"+
        "<td><span class='pill "+(TYPE_CLS2[x.type]||"gry")+"'>"+esc(x.type)+"</span></td>"+
        "<td class='num'>"+esc(x.excel)+"</td><td class='num'>"+esc(x.feishu)+"</td><td class='num'>"+deltaTxt(x)+
        "</td><td class='lft reason'>"+esc(x.note)+"</td></tr>";
      }).join("")+"</tbody>";
    tbl.querySelectorAll("input[type=checkbox]").forEach(function(cb){
      cb.addEventListener("change",function(){
        if(cb.checked) done[cb.dataset.k]=1; else delete done[cb.dataset.k];
        saveDone(); refreshBadge(); drawAnom();
      });
    });
  }
  function refreshBadge(){
    var p=A.filter(function(x){return !done[x.name+"|"+x.type]}).length;
    var b=document.getElementById("anomBadge");
    if(p){ b.style.display="inline-block"; b.textContent=p; } else b.style.display="none";
  }
  aType.addEventListener("change",drawAnom);
  document.getElementById("aDone").addEventListener("change",drawAnom);
  document.getElementById("aKw").addEventListener("input",drawAnom);
  drawAnom();
}

/* ── 合同台账 ── */
if(D.contract){
  var C=D.contract, CR=C.rows;
  document.getElementById("ctNote").innerHTML =
    "合同台账数据快照 <b>"+C.today+"</b>（与考勤快照相互独立）。想看勾选重点/分组视图请打开 <a href='contract.html' target='_blank' style='color:var(--yel)'><b>合同台账完整页</b></a>。点击「文档」可跳转金山文档原合同。";
  var S=C.stats;
  document.getElementById("ctCards").innerHTML=[
    {n:S["在册"],l:"在册合同",c:""},
    {n:S["30天内到期"],l:"30天内到期",c:"red"},
    {n:S["31-90天到期"],l:"31-90天到期",c:"yel"},
    {n:S["91-180天到期"],l:"91-180天到期",c:"yel"},
    {n:S["180天以上"],l:"180天以上",c:"gre"},
    {n:S["已过期未续签"],l:"已过期未续签",c:"red"}
  ].map(function(c){return '<div class="card '+c.c+'"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>'}).join("");

  var cZone=document.getElementById("cZone"), cStatus=document.getElementById("cStatus"), cBrand=document.getElementById("cBrand");
  var ZONES=[["main","在册"],["ended","已解除"],["archive","已到期归档"]];
  cZone.innerHTML='<option value="">全部区域（'+CR.length+'）</option>'+ZONES.map(function(z){
    var n=CR.filter(function(r){return r.zone===z[0]}).length;
    return '<option value="'+z[0]+'">'+z[1]+'（'+n+'）</option>';
  }).join("");
  var sts=[...new Set(CR.map(function(r){return r.status}).filter(Boolean))];
  fill(cStatus,sts,"全部状态");
  var brands=[...new Set(CR.map(function(r){return r.brand}).filter(function(b){return b&&b!=="/"}))].sort();
  fill(cBrand,brands,"全部品牌");
  var CT_CLS={"30天内到期":"red","31-90天到期":"org","91-180天到期":"yel","180天以上":"gre",
    "已过期未续签":"red","已接续":"gry","未约定终止日":"gry","已解除":"gry","已到期归档":"gry","已终止·未签协议":"red"};
  function ctLink(l){ if(!l) return ""; var m=String(l).match(/https?:\/\/[^\s"']+/);
    return m?'<a href="'+esc(m[0].replace(/["',)\]]+$/,""))+'" target="_blank" style="color:var(--mid)">文档</a>':""; }
  var cCols=[{t:"编号"},{t:"品牌"},{t:"业务"},{t:"合同名称"},{t:"对方单位"},{t:"签订"},{t:"到期"},{t:"剩余天数"},{t:"状态"},{t:"续签备注"},{t:"文档"}];
  function drawCT(){
    var z=cZone.value, st=cStatus.value, bd=cBrand.value, kw=document.getElementById("cKw").value.trim();
    var rows=CR.filter(function(r){
      if(z&&r.zone!==z) return false;
      if(st&&r.status!==st) return false;
      if(bd&&r.brand!==bd) return false;
      if(kw){ var s=(r.name+" "+r.party_b+" "+r.party_a+" "+r.code+" "+r.index).toLowerCase(); if(s.indexOf(kw.toLowerCase())<0) return false; }
      return true;
    });
    document.getElementById("cCnt").textContent="共 "+rows.length+" 份";
    sortTbl(document.getElementById("cTbl"), cCols, rows.map(function(r){
      return [r.index||"",r.brand||"",r.biz||"",r.name,r.party_b||r.party_a||"",r.sign||"",r.end||"",
        r.days===null||r.days===undefined?"":r.days,r.status||"",r.renew_note||r.remark||"",r.link];
    }), function(r){
      var d=r[7]; var dd = d===""?"–":(d<0?'<span style="color:var(--red)">过期'+(-d)+'天</span>':d+"天");
      var nm=r[3]&&r[3].length>38?r[3].slice(0,38)+"…":r[3];
      return "<tr><td class='gry'>"+esc(r[0])+"</td><td>"+esc(r[1])+"</td><td>"+esc(r[2])+
      "</td><td class='lft' title='"+esc(r[3])+"'>"+esc(nm)+"</td><td class='lft'>"+esc(r[4])+
      "</td><td>"+esc(r[5])+"</td><td>"+esc(r[6])+"</td><td class='num'>"+dd+
      "</td><td>"+(r[8]?'<span class="pill '+(CT_CLS[r[8]]||"gry")+'">'+esc(r[8])+'</span>':"")+
      "</td><td class='lft reason'>"+esc(r[9])+"</td><td>"+ctLink(r[10])+"</td></tr>";
    });
  }
  [cZone,cStatus,cBrand].forEach(function(s){s.addEventListener("change",drawCT)});
  document.getElementById("cKw").addEventListener("input",drawCT);
  drawCT();
}
</script>
</body>
</html>
