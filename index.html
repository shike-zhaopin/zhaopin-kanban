<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今日招聘看板 · 十克招聘工作台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f4f5f8;color:#2b2b33;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 顶栏 ---------- */
  .top{
    flex:0 0 auto;background:#1f2a44;color:#fff;
    box-shadow:0 2px 10px rgba(20,28,48,.16);position:relative;z-index:10;
  }
  .topbar{
    max-width:1280px;margin:0 auto;height:58px;padding:0 18px;
    display:flex;align-items:center;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding-right:14px;border-right:1px solid rgba(255,255,255,.16)}
  .brand .mark{
    width:26px;height:26px;border-radius:7px;background:#3b6fe0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#fff;flex:0 0 auto;
  }
  .brand .txt{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .brand .txt i{font-style:normal;font-weight:500;font-size:11px;opacity:.6;margin-left:6px;letter-spacing:.04em}

  .tabs{display:flex;align-items:center;gap:5px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:600;letter-spacing:.01em;line-height:1.2;
    color:rgba(255,255,255,.66);padding:8px 15px;border-radius:9px;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .tab:hover{color:#fff;background:rgba(255,255,255,.09)}
  .tab.active{background:#fff;color:#1f2a44;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4c86f0;margin-right:7px;vertical-align:1.5px}
  .tab.active .dot{background:#3b6fe0}

  .meta{flex:0 0 auto;text-align:right;font-size:11px;line-height:1.55;color:rgba(255,255,255,.5);white-space:nowrap}
  .meta b{display:block;color:rgba(255,255,255,.92);font-size:12px;font-weight:600;letter-spacing:.02em}
  .meta .live{
    display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ddc84;
    margin-right:6px;vertical-align:1.5px;box-shadow:0 0 0 0 rgba(61,220,132,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}
    70%{box-shadow:0 0 0 5px rgba(61,220,132,0)}
    100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}
  }

  /* ---------- 内容区 ---------- */
  .stage{flex:1 1 auto;min-height:0;position:relative;background:#f4f5f8}
  .stage iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    display:none;background:#f4f5f8;
  }
  .stage iframe.on{display:block}
  .loading{
    position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    background:#f4f5f8;font-size:13px;color:#8a8a94;gap:9px;transition:opacity .2s;
  }
  .loading.hide{opacity:0;pointer-events:none}
  .spin{width:15px;height:15px;border:2px solid #d6dae6;border-top-color:#3b6fe0;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:760px){
    .topbar{height:52px;padding:0 12px;gap:10px}
    .brand{border-right:0;padding-right:0}
    .brand .txt i{display:none}
    .brand .txt{font-size:13.5px}
    .tab{font-size:12.5px;padding:7px 11px}
    .meta{display:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="topbar">
    <div class="brand">
      <div class="mark">十</div>
      <div class="txt">招聘工作台<i>SIKERS · HR</i></div>
    </div>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-key="recruit"><span class="dot"></span>今日招聘看板</button>
      <button class="tab" data-key="weekly"><span class="dot"></span>招聘周报</button>
      <button class="tab" data-key="mps"><span class="dot"></span>管培生简历</button>
      <button class="tab" data-key="xc"><span class="dot"></span>校招简历</button>
    </nav>

    <div class="meta"><b><span class="live"></span>实时同步</b>数据以《招聘共享总表》为准</div>
  </div>
</header>

<main class="stage" id="stage">
  <div class="loading" id="loading"><div class="spin"></div>加载中…</div>
</main>

<script>
(function(){
  var PANELS = {
    recruit: {file:'recruit.html', title:'今日招聘看板'},
    weekly : {file:'weekly.html',  title:'招聘周报'},
    mps    : {file:'mps.html',     title:'管培生简历看板'},
    xc     : {file:'xc.html',      title:'校招简历看板'}
  };

  var stage   = document.getElementById('stage');
  var loading = document.getElementById('loading');
  var tabs    = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var frames  = {};
  var current = null;
  var loadingTimer = null;

  function makeFrame(key){
    if (frames[key]) return frames[key];
    var f = document.createElement('iframe');
    f.setAttribute('title', PANELS[key].title);
    f.dataset.key = key;
    f.addEventListener('load', function(){
      f.dataset.ready = '1';
      if (current === key) {
        clearTimeout(loadingTimer);
        loading.classList.add('hide');
      }
    });
    f.src = PANELS[key].file;
    stage.appendChild(f);
    frames[key] = f;
    return f;
  }

  function activate(key, push){
    if (!PANELS[key]) key = 'recruit';
    if (key === current) return;

    var existed = !!frames[key];
    current = key;

    if (!existed) {
      // 首次进入该板块 → 显示加载态，最多等 8 秒
      loading.classList.remove('hide');
      clearTimeout(loadingTimer);
      loadingTimer = setTimeout(function(){ loading.classList.add('hide'); }, 8000);
    }

    var frame = makeFrame(key);
    Object.keys(frames).forEach(function(k){
      frames[k].classList.toggle('on', k === key);
    });
    frame.classList.add('on');

    if (frame.dataset.ready === '1') loading.classList.add('hide');

    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.key === key); });
    document.title = PANELS[key].title + ' · 十克招聘工作台';

    if (push && history.replaceState) history.replaceState(null, '', '#' + key);
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ activate(t.dataset.key, true); });
  });

  window.addEventListener('hashchange', function(){
    activate((location.hash || '').replace('#',''), false);
  });

  var first = (location.hash || '').replace('#','');
  if (!PANELS[first]) first = 'recruit';
  activate(first, true);
})();
</script>
</body>
</html>
