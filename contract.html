<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A4C3F">
<title>合同到期提醒 · 2026-11-10</title>
<style>
:root{
  --ink:#14201B; --ink2:#4A5A54; --mute:#8A9691; --line:#E2E9E5;
  --dark:#0A4C3F; --mid:#146B57; --band:#F4F8F6; --page:#FFFFFF;
  --red:#B42318; --redbg:#FBE4E1; --org:#A54A05; --orgbg:#FCE9D2;
  --yel:#7A5E00; --yelbg:#FDF6DC; --gre:#3F6B58; --grebg:#EDF3EF;
  --gold:#B7791F; --goldbg:#FFFBF0; --goldline:#EFDFBA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Helvetica Neue",sans-serif;
  color:var(--ink);background:#EEF2F0;font-size:13px;line-height:1.5;-webkit-text-size-adjust:100%}

/* ── 顶栏 ── */
.topbar{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff;
  padding:0 22px;height:56px;display:flex;align-items:center;gap:16px;
  box-shadow:0 2px 8px rgba(10,76,63,.14)}
.brand{font-size:15px;font-weight:700;letter-spacing:1.2px;white-space:nowrap}
.brand em{font-style:normal;font-weight:400;font-size:12px;opacity:.62;
  margin-left:10px;letter-spacing:0}
.topbar .sp{flex:1}
.tmeta{font-size:11.5px;opacity:.78;white-space:nowrap;text-align:right;line-height:1.45}
.tbtn{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.09);
  color:#fff;font-size:12px;padding:6px 12px;border-radius:6px;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:.15s}
.tbtn:hover{background:rgba(255,255,255,.2)}
.tbtn.done{background:#fff;color:var(--dark);border-color:#fff}

.wrap{max-width:1460px;margin:0 auto;padding:20px 22px 60px}

/* ── 统计卡 ── */
.cards{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.card .n{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.card .l{font-size:11px;color:var(--mute);margin-top:3px;white-space:nowrap}
.card.red{border-color:#F1CFC9;background:linear-gradient(180deg,#FEF7F6,#fff)}
.card.red .n{color:var(--red)}
.card.org .n{color:var(--org)}
.card.yel .n{color:var(--yel)}
.card.gre .n{color:var(--gre)}

/* ── 勾选 / 重点跟进 ── */
.pc{width:38px;text-align:center;padding-left:10px !important}
th.pc{color:#9FC0B3;font-size:12px}
.pk{width:19px;height:19px;border-radius:5px;border:1.5px solid #C9D5D0;background:#fff;
  cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;
  color:transparent;font-size:12px;line-height:1;font-family:inherit;transition:.14s;
  -webkit-appearance:none;appearance:none}
.pk:hover{border-color:var(--gold);background:var(--goldbg)}
.pk.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;
  box-shadow:0 1px 3px rgba(183,121,31,.3)}
/* 勾选行：不做整行底色块，只留 ★ 列左侧金色竖条作标记 */
tr.row.picked td:nth-child(2){box-shadow:inset 3px 0 0 var(--gold)}
.sect.pick .no{color:var(--gold)}
.sect.pick .badge{background:var(--gold)}
.sect .acts{margin-left:auto;display:flex;gap:7px}
.sect .mini{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:11px;
  padding:4px 10px;border-radius:5px;cursor:pointer;font-family:inherit;transition:.13s}
.sect .mini:hover{border-color:var(--gold);color:var(--gold)}
.sect .mini.ok{background:var(--gold);border-color:var(--gold);color:#fff}
.pikhint{background:var(--goldbg);border:1px dashed var(--goldline);border-radius:10px;
  padding:16px 18px;font-size:12px;color:#8A6B2A;line-height:1.8}
.pikhint b{color:var(--gold)}
.pikmiss{margin-top:8px;background:#FDF7E8;border:1px solid var(--goldline);border-radius:8px;
  padding:9px 12px;font-size:11.5px;color:#8A6B2A;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pikmiss b{color:var(--gold)}
.pikmiss .mini{margin-left:auto}

/* ── 工具条 ── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#q{flex:1;min-width:240px;padding:9px 13px;border:1px solid var(--line);border-radius:7px;
  font-size:13px;font-family:inherit;background:#fff;outline:none}
#q:focus{border-color:var(--mid);box-shadow:0 0 0 3px rgba(20,107,87,.08)}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;background:#fff;
  cursor:pointer;font-size:12px;color:var(--ink2);user-select:none;white-space:nowrap;transition:.13s}
.chip:hover{border-color:var(--mid);color:var(--mid)}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}

/* ── 到期预警图例 ── */
.lg{display:flex;align-items:center;gap:14px;margin:-2px 0 12px;font-size:11.5px;
  color:var(--mute);flex-wrap:wrap}
.lg b{font-weight:600;color:var(--ink2)}
.lgpair{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg .bar{width:56px;height:9px;border-radius:2px;flex:0 0 auto}
.lg .bar.red{background:linear-gradient(90deg,#FCE9E5,#EFB3A9,#D98878)}
.lg .bar.green{background:linear-gradient(90deg,#A8D4BA,#C8E3D3,#E4F1E9)}
.pill{display:inline-block;padding:1.5px 7px;border-radius:4px;font-size:11.5px;
  font-weight:700;font-variant-numeric:tabular-nums;min-width:34px;text-align:center}

/* ── 区块标题条 ── */
.sect{display:flex;align-items:center;gap:9px;margin:20px 2px 9px;flex-wrap:wrap}
.sect:first-child{margin-top:2px}
.sect .no{font-size:16px;font-weight:700;color:var(--dark);line-height:1}
.sect b{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.4px}
.sect .badge{font-size:11.5px;font-weight:700;color:#fff;background:var(--mid);
  padding:2.5px 10px;border-radius:11px;line-height:1.3}
.sect .desc{font-size:11.5px;color:var(--mute);letter-spacing:.2px}
.sect.dim .no,.sect.dim b{color:#8A9691}
.sect.dim .badge{background:#B3BDB9}

/* ── 表格 ── */
.panel{background:var(--page);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--dark);color:#fff;font-weight:600;
  padding:9px 8px;text-align:left;font-size:11.5px;white-space:nowrap}
tbody td{padding:7px 8px;border-bottom:1px solid #F0F4F2;vertical-align:middle}
tr.grp td{background:#EAF1ED;font-weight:600;color:var(--dark);padding:6px 10px;
  font-size:11.5px;letter-spacing:.2px;border-bottom:1px solid #D8E4DE}
tr.grp .cnt{font-weight:400;color:var(--ink2);margin-left:8px}
tr.row:hover td{background:#FAFCFB}
tr.row td:first-child{border-left:3px solid var(--rowc, transparent)}
tr.row.dimrow td:first-child{border-left-color:#E4E9E7}
.num{font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.name{max-width:330px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.t-over{background:var(--redbg);color:var(--red)}
.t-30{background:var(--orgbg);color:var(--org)}
.t-90{background:var(--yelbg);color:var(--yel)}
.t-ok{background:transparent;color:var(--mute);font-weight:400}
.t-renew{background:var(--grebg);color:var(--gre);font-weight:400}
.t-term{background:#F1EAE0;color:#8A6D3B;font-weight:400}
.dimrow td{color:#B3BDB9;background:#FAFBFA}
.dimrow .tag{background:#F0F0F0;color:#A8A8A8;font-weight:400}
.sub{color:var(--mute);font-size:11px}
footer{margin-top:16px;font-size:11.5px;color:var(--mute);line-height:1.85}

/* ── 手机卡片 ── */
#mob{display:none}
.mbanner{margin:18px 2px 9px;display:block}
.mbanner .no{font-size:15px;font-weight:700;color:var(--dark);margin-right:5px}
.mbanner b{font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--ink)}
.mbanner .mbadge{font-size:10.5px;font-weight:700;color:#fff;background:var(--mid);
  padding:2px 9px;border-radius:10px;margin-left:7px;vertical-align:1px}
.mbanner .md{display:block;font-size:11px;color:var(--mute);margin-top:3px}
.mbanner.dim .no,.mbanner.dim b{color:#8A9691}
.mbanner.dim .mbadge{background:#B3BDB9}
.mgrp{font-size:11.5px;font-weight:700;color:var(--dark);letter-spacing:.4px;
  margin:12px 2px 6px;display:flex;align-items:center;gap:7px}
.mgrp i{flex:1;height:1px;background:var(--line);font-style:normal}
.mgrp span{font-weight:400;color:var(--mute);font-size:11px}
.mcard{background:#fff;border:1px solid var(--line);border-left:4px solid #E4E9E7;
  border-radius:9px;padding:10px 12px;margin-bottom:7px}
.mcard.dim{background:#FAFBFA;border-color:#EDF1EF;border-left-color:#E9EDEB}
.mtop{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.mtop .md{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px}
.mname{font-size:13px;font-weight:600;line-height:1.45;margin-bottom:4px}
.mcard.dim .mname{color:#9AA6A1;font-weight:400}
.mcard.picked{border-left-color:var(--gold) !important}
.mtop .psq{margin-left:auto}
.mtop .psq + .md{margin-left:8px}
.mcard .pk{width:20px;height:20px}
.mline{font-size:11.5px;color:var(--ink2);line-height:1.65}
.mline.k{color:var(--mute)}

/* ── 响应式 ── */
@media(max-width:1180px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){
  .topbar{height:52px;padding:0 14px;gap:10px}
  .brand{font-size:14px}
  .brand em{display:none}
  .tmeta{font-size:10.5px}
  .tbtn{padding:5px 10px;font-size:11.5px}
  .wrap{padding:14px 14px 40px}
  .cards{display:flex;overflow-x:auto;gap:8px;margin:0 -14px 12px;padding:0 14px 6px;
    scrollbar-width:none}
  .cards::-webkit-scrollbar{display:none}
  .card{flex:0 0 106px;padding:9px 11px}
  .card .n{font-size:19px}
  .card .l{font-size:10.5px}
  .toolbar{gap:6px}
  #q{min-width:100%;padding:10px 12px;font-size:13.5px}
  .chip{padding:6px 11px;font-size:11.5px}
  .sect.pick .acts{width:100%;margin-left:0}
  .sect.pick .desc{display:none}
  .panel{display:none}
  .sect{display:none}
  #mob{display:block}
  footer{font-size:11px}
}
@media print{
  .topbar{position:static;background:#fff;color:var(--ink);box-shadow:none;
    border-bottom:2px solid var(--dark)}
  .brand{color:var(--dark)} .tmeta{color:var(--mute);opacity:1}
  .tbtn{display:none}
  .cards{grid-template-columns:repeat(8,1fr)}
  thead th{position:static;background:#EAF1ED;color:var(--dark)}
  #mob{display:none} .panel{display:block}
  body{background:#fff}
}

/* ── 更新提示条 ── */
.upd{margin:0 0 12px;background:#F1F6FC;border:1px solid #D8E5F4;border-radius:10px;
  padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:#31506E;line-height:1.6}
.upd .h{background:#31506E;color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;
  padding:2px 6px;letter-spacing:.4px}
.upd b{color:#16334F;font-weight:700}
.upd .g{color:#2C7A52}.upd .r{color:#B44A3C}.upd .o{color:#9A6B18}
.upd .sp{flex:1}
.upd .mini{border:1px solid #C6D6E8;background:#fff;color:#31506E;font-size:11px;
  padding:4px 10px;border-radius:5px;cursor:pointer;font-family:inherit}
.upd .mini:hover{border-color:#8FAECF;background:#F7FAFE}
.diffs{margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;overflow:hidden}
.diffs .dh{font-size:11.5px;font-weight:700;color:var(--ink2);margin:10px 0 5px;
  display:flex;align-items:center;gap:7px}
.diffs .dh:first-child{margin-top:0}
.diffs .dh .n{background:#EEF2F0;color:#4A6B5C;border-radius:9px;padding:1px 7px;font-weight:600;font-size:10.5px}
.diffs table{width:100%;border-collapse:collapse;font-size:11.5px}
.diffs td{padding:4px 8px;border-bottom:1px solid #F2F4F3;color:var(--ink2);vertical-align:top}
.diffs td:first-child{white-space:nowrap;color:var(--mute);width:56px}
.diffs td.g2{white-space:nowrap;color:var(--ink2);width:70px}
.diffs .none{color:var(--mute);font-size:11.5px;padding:2px 8px}

/* ── 手写说明 ── */
td.notecell{cursor:text;min-width:168px;max-width:300px;position:relative}
td.notecell .pen{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  font-style:normal;font-size:11px;color:#C6AE7B;opacity:0;transition:.13s;pointer-events:none}
td.notecell:hover .pen{opacity:1}
/* 手写说明 = 浅红（与到期预警同色系），系统带入的说明保持灰色，便于区分来源 */
td.notecell.hasnote .nv{color:#B4554A;font-weight:500}
td.notecell .ns{color:var(--mute)}
.ne{display:block;outline:none;border:1px solid var(--gold);border-radius:5px;background:#fff;
  padding:4px 6px;min-height:20px;font:inherit;color:var(--ink);line-height:1.55;white-space:pre-wrap;
  box-shadow:0 0 0 3px rgba(183,121,31,.10)}
.ne:empty:before{content:attr(data-ph);color:#BEC7C2}
.nesys{font-size:10.5px;color:var(--mute);line-height:1.45;margin-top:4px}
.mnote{margin-top:7px;font-size:11.5px;color:#3F4A46;
  border:1px dashed #E3E9E5;border-radius:6px;padding:5px 8px;line-height:1.6;white-space:pre-wrap}
.mnote .nv{color:#B4554A;font-weight:500}
.mnote .ns{color:var(--mute)}
.mnote .pen{color:#C6AE7B;font-style:normal;margin-left:4px}
.mnoteauto{margin-top:6px;font-size:11px;color:var(--mute);line-height:1.5}

/* ── 新增标记 ── */
.tag.new{background:#E4F1EA;color:#2C7A52;font-weight:600;font-size:10px;padding:1px 5px;
  border-radius:3px;margin-right:5px;vertical-align:1px}
.mcard.isnew{border-color:#BEDFCB}

/* ── 截图提取记录 ── */
.omodal{position:fixed;inset:0;background:rgba(40,48,45,.45);z-index:60;display:none;
  align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.omodal.on{display:flex}
.obox{background:#fff;border-radius:12px;width:640px;max-width:100%;padding:22px 24px;
  box-shadow:0 18px 50px rgba(0,0,0,.18)}
.obox h3{margin:0 0 4px;font-size:16px;font-weight:700;color:var(--ink)}
.obox .sub{font-size:12px;color:var(--mute);margin-bottom:14px;line-height:1.6}
.odrop{border:1.5px dashed #C7D2CC;border-radius:10px;padding:22px;text-align:center;
  font-size:13px;color:var(--mute);cursor:pointer;transition:.15s;line-height:1.7}
.odrop:hover,.odrop.drag{border-color:var(--gold);background:#FFFBF2;color:var(--ink)}
.olog{margin-top:12px;font-size:12px;line-height:1.9;color:var(--mute);max-height:130px;overflow:auto}
.olog b{color:var(--ink)}
.orec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:#FCFDFC}
.orec .h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--mute)}
.orec .h b{color:var(--ink);font-size:13px}
.orec .h .x{margin-left:auto;cursor:pointer;color:#C97B6F;font-size:12px}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px}
.ogrid label{font-size:11px;color:var(--mute);display:block;margin-bottom:2px}
.ogrid input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;font-size:12.5px;font-family:inherit;color:var(--ink);background:#fff}
.ogrid input:focus{outline:none;border-color:var(--gold)}
.ogrid .full{grid-column:1/-1}
.oacts{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;align-items:center}
.oacts .stat{font-size:12px;color:var(--mute);margin-right:auto}
.othumb{width:100%;max-height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.orecs{margin-top:10px}
.orecard{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;
  padding:10px 14px;margin-top:8px;background:#fff}
.orecard .t{font-weight:600;font-size:13.5px;color:var(--ink)}
.orecard .m{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.7}
.orecard .raw{font-size:11px;color:#A8B3AE;margin-top:5px;border-top:1px dashed var(--line);
  padding-top:5px;display:none;line-height:1.7;white-space:pre-wrap}
.orecard.open .raw{display:block}
.orecard .match{font-size:11px;padding:1px 6px;border-radius:3px;font-weight:600}
.orecard .match.yes{background:#E4F1EA;color:#2C7A52}
.orecard .match.no{background:#F7E8E4;color:#B4554A}
/* ── 截图挑选模式 ── */
.shotlab{display:inline-block;margin-left:5px;vertical-align:middle;cursor:pointer}
.shotlab input{accent-color:var(--gold);width:13px;height:13px;cursor:pointer;margin:0}
tr.shotoff{display:none}
.hidebar{margin-top:8px;padding:7px 12px;border:1px dashed #E3D9C6;border-radius:8px;
  font-size:11.5px;color:#8A8064;background:#FFFDF7;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hidechip{cursor:pointer;color:#B08A3E;border-bottom:1px dotted #C9B37E;padding:1px 2px}
.hidechip:hover{color:#8A6A20}
</style>

<style id="wb-embed-tweak">
.topbar{position:static;height:46px;padding:0 14px;box-shadow:none}
.topbar .brand{display:none}
.topbar .tmeta{font-size:11px;line-height:1.35;opacity:.85}
.wrap{padding:14px 14px 40px}
@media(max-width:640px){.topbar{height:auto;flex-wrap:wrap;gap:6px;padding:8px 10px}.topbar .tmeta{display:none}}
</style>

const tidy = s => String(s == null ? "" : s)
  .replace(/\u00a0/g, " ").replace(/\s+/g, "")
  .replace(/（/g, "(").replace(/）/g, ")")
  .replace(/[·•.,，、\-—_/｜|]/g, "").toLowerCase();

/* 相似度用的归一化：剔除括号内容（年份/编号），用于「改名了也能认出来」 */
const norm = s => (s == null ? "" : String(s))
  .replace(/[（(][^）)]*[)）]/g, "")
  .replace(/[【】\[\]「」]/g, "")
  .replace(/[\s·•.,，、\-—_/｜|]/g, "").toLowerCase();

const bigrams = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); m.set(k, (m.get(k) || 0) + 1); } return m; };
const sim = (a, b) => {
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.includes(b) || b.includes(a)) return 0.95;
  const A = bigrams(a), B = bigrams(b);
  let inter = 0, tot = 0;
  A.forEach((v, k) => { tot += v; if (B.has(k)) inter += Math.min(v, B.get(k)); });
  B.forEach(v => { tot += v; });
  return tot ? (2 * inter) / tot : 0;
};

/* 把存储里的记录对到当前数据：① uid 精确 ② 名称+乙方 ③ 名称 ④ 相似度≥0.72 且同品牌 */
function bindMap(map) {
  const used = new Set(), hit = new Map(), miss = [], rest = [];
  const rows = D.rows;
  for (const k of Object.keys(map || {})) {
    if (byUid.has(k) && !used.has(k)) { used.add(k); hit.set(k, map[k]); }
    else rest.push([k, map[k]]);
  }
  for (const [k, rec] of rest) {
    if (!rec || typeof rec !== "object") continue;
    let r = null;
    const rn = tidy(rec.n);
    if (rn) {
      r = rows.find(x => !used.has(x.__uid) && tidy(x.name) === rn && tidy(x.party_b) === tidy(rec.b))
       || rows.find(x => !used.has(x.__uid) && tidy(x.name) === rn);
    }
    if (!r && rec.n) {
      let best = null, bs = 0;
      for (const x of rows) {
        if (used.has(x.__uid)) continue;
        if (rec.g && x.group && x.group !== rec.g) continue;
        const sc = sim(rec.n, x.name);
        if (sc > bs) { bs = sc; best = x; }
      }
      if (bs >= 0.72) r = best;
    }
    if (r) { used.add(r.__uid); hit.set(r.__uid, rec); }
    else miss.push([k, rec]);
  }
  return { hit, miss };
}

  pm.miss.forEach(([k, rec]) => { if (!(k in np)) np[k] = rec; });   // 没对上的保留，数据回来能接上
  const nn = {};
  nm.hit.forEach((rec, u) => { nn[u] = rec; });
  nm.miss.forEach(([k, rec]) => { if (!(k in nn)) nn[k] = rec; });
  PICKS = np; NOTES = nn;

  nm.hit.forEach((rec, u) => { const r = byUid.get(u); if (r) r.__note = rec; });

}

  let h = 0;
  for (const str of arr) {
    for (let j = 0; j < str.length; j++) h = (h * 33 + str.charCodeAt(j)) | 0;
    h = (h * 33 + 31) | 0;
  }
  return D.rows.length + ":" + h;
};
let DIFF = null, NEWSET = new Set(), diffOpen = false;

(function calcDiff() {
  const fp = fpOf();
  const snap = L.get(K_SNAP, null);
  const cur = {};
  for (const r of D.rows) cur[r.__uid] = { e: r.end || r.end_raw || "", s: r.status, n: r.name || "", g: r.group || "", i: r.index || "" };
  if (!snap || !snap.items) { L.set(K_SNAP, { fp, date: D.today, n: D.rows.length, items: cur }); return; }
  if (snap.fp === fp) { DIFF = L.get(K_DIFF, null); }
  else {
    const prev = snap.items;
    const added = D.rows.filter(r => !prev[r.__uid])
      .map(r => ({ u: r.__uid, n: r.name || "", g: r.group || "", i: r.index || "", e: r.end || r.end_raw || "" }));
    const gone = Object.keys(prev).filter(u => !cur[u]).map(u => ({ u, n: prev[u].n, g: prev[u].g, i: prev[u].i, e: prev[u].e }));
    const changed = [];
    for (const r of D.rows) {
      const p = prev[r.__uid]; if (!p) continue;
      const e = r.end || r.end_raw || "";
      if (p.e !== e) changed.push({ u: r.__uid, n: r.name || "", g: r.group || "", i: r.index || "", from: p.e, to: e });
    }
    DIFF = { from: snap.date, to: D.today, fromN: snap.n, toN: D.rows.length, added, gone, changed };
    L.set(K_SNAP, { fp, date: D.today, n: D.rows.length, items: cur });
    L.set(K_DIFF, DIFF);
  }
  NEWSET = new Set((DIFF && DIFF.added || []).map(x => x.u));
})();

/* ══════════ 渲染 ══════════ */
let filter = "all", kw = "";

/* 截图挑选模式：勾掉不想截的行，行隐藏（可从「已隐藏」条里点回来），截完点完成恢复 */
let shotMode = false;
const SHOT_HIDE = new Set();
const hitKw = r => !kw || [r.index, r.group, r.name, r.party_a, r.party_b, r.code, r.biz, r.remark, (r.__note && r.__note.t) || ""]
  .join(" ").toLowerCase().includes(kw);
const hit = r => {
  if (filter === "picked") return hasPick(r) && hitKw(r);
  if (filter === "new") return NEWSET.has(r.__uid) && hitKw(r);
  if (filter === "ocr") return false;
  if (filter === "over90")
    return !(r.block === "ended" || r.block === "archive") && r.days != null && r.days > 90 && hitKw(r);
  if (filter !== "all") {
    const closed = r.block === "ended" || r.block === "archive";
    if (closed || r.status !== filter) return false;
  }
  return hitKw(r);
};
const autoNote = r => r.renew_note || r.remark || "";
const groups = list => {
  const m = new Map();
  for (const r of list) { if (!m.has(r.group)) m.set(r.group, []); m.get(r.group).push(r); }
  return [...m.entries()];
};
const byDays = (a, b) => (a.days == null ? 1e9 : a.days) - (b.days == null ? 1e9 : b.days);
const isDim = r => r.block === "ended" || r.block === "archive";

const SECTIONS = [
  ["over",   "①", "已过期 · 待确认", "按品牌分组，越靠上越新近过期 · 请尽快确认续签或终止", false],
  ["up",     "②", "有效期内",       "按品牌分组，越靠上越先到期", false],
  ["un",     "③", "未约定终止日 / 长期", "无到期日，不纳入提醒统计", true],
  ["ended",  "④", "已结束 · 仅留档", "已解除 / 提前终止 / 已终止合作未签协议，不再作为续签对象", true],
  ["archive","⑤", "2025 年 12 月 31 日前已到期 · 归档", "仅留档，不再提醒", true],
];

const THEAD = `<thead><tr>

const pickBtn = r => {

  }

};

const NOTE_MAX = 40;
const cut = (s, n) => { s = s || ""; return s.length > n ? s.slice(0, n) + "…" : s; };

/* 说明列 = 手写（浅红）+ 系统备注（灰）合并显示在同一格，靠颜色区分来源；
   两者内容相同时只显示一条，避免重复 */
const noteCell = r => {
  const mine = (r.__note && r.__note.t) || "";
  const raw = autoNote(r) || "";
  const same = !!mine && norm(raw) === norm(mine);
  const sys = same ? "" : cut(raw, NOTE_MAX);
  const parts = [];
  if (mine) parts.push(`<span class="nv">${ESC(mine)}</span>`);
  if (sys) parts.push(`<span class="ns">${ESC((mine ? "｜" : "") + sys)}</span>`);
  const tip = "点一下写自己的说明｜Enter 保存 · Shift+Enter 换行 · Esc 取消"
    + (sys ? ` ｜ 系统备注：${raw}` : "");
  return `<td class="sub notecell${mine ? " hasnote" : ""}" data-note="${ESC(r.__uid)}" title="${ESC(tip)}">${parts.join("")}<i class="pen">✎</i></td>`;
};

const rowHtml = (r, dim) => {
  const u = dim ? null : URGENCY(r.days);

  return `<tr class="row ${dim ? "dimrow" : ""}${hasPick(r) ? " picked" : ""}${isnew ? " isnew" : ""}${shotMode && SHOT_HIDE.has(r.__uid) ? " shotoff" : ""}"${u ? ` style="--rowc:${u.c}"` : ""}>

const cardHtml = (r, dim) => {

  const mine = (r.__note && r.__note.t) || "";

    ? `<div class="mnote" data-note="${ESC(r.__uid)}">`
      + (mine ? `<span class="nv">${ESC(mine)}</span>` : "")
      + (sysM ? `<span class="ns">${ESC((mine ? "｜" : "") + sysM)}</span>` : "")

    : `<div class="mnoteauto" data-note="${ESC(r.__uid)}"><span style="color:#C6AE7B">✎ 写说明</span></div>`;

};

const diffHtml = () => {
  if (!DIFF) return "";

  let h = `<div class="upd"><span class="h">数据已更新</span>
    <b>${DIFF.from === DIFF.to ? `${DIFF.from} 换了新表` : `${DIFF.from} → ${DIFF.to}`}（${DIFF.fromN} → ${DIFF.toN} 份）</b>

      <div class="dh">到期日变了<span class="n">${C.length}</span></div>

    mob += `<div class="mbanner"><span class="no">★</span><b>重点跟进</b><span class="mbadge">0 份</span></div>

  const cn = document.getElementById("chipNew");
  if (cn) { cn.style.display = NEWSET.size ? "" : "none"; cn.textContent = `本次新增 ${NEWSET.size}`; }
  const co = document.getElementById("chipOcr");
  if (co) { const n = ocrCount(); co.style.display = n ? "" : "none"; co.textContent = `📷 截图提取 ${n}`; }

  document.getElementById("ft").innerHTML =
    `共 ${rows.length} 份合同　｜　当前显示 ${shown} 份　｜　重点跟进 <b>${pc}</b> 份　｜　手写说明 <b>${noteCount()}</b> 条<br>` +

    `换电脑或换浏览器时，用右上角「导出 / 导入」把标注带走。`;

/* ══════════ 手写说明：点一下就编辑 ══════════ */
function startEdit(box) {
  if (!box || box.querySelector(".ne")) return;
  const r = byUid.get(box.dataset.note);
  if (!r) return;
  const cur = (r.__note && r.__note.t) || "";
  const sysAll = autoNote(r);
  const ph = sysAll.slice(0, 44);
  const old = box.innerHTML;
  /* 编辑时只改自己写的；系统备注以小字留在下面，避免看起来"消失了" */
  const sysLine = (sysAll && !(cur && norm(sysAll) === norm(cur)))
    ? `<div class="nesys">系统备注：${ESC(sysAll)}</div>` : "";
  box.innerHTML = `<div class="ne" contenteditable="true" data-ph="${ESC(ph)}">${ESC(cur)}</div>${sysLine}`;
  const ne = box.querySelector(".ne");
  ne.focus();
  const rg = document.createRange(); rg.selectNodeContents(ne); rg.collapse(false);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    const v = ne.innerText.replace(/\u00a0/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    if (!save) { box.innerHTML = old; return; }
    if (v === cur) { box.innerHTML = old; return; }
    const y = window.scrollY;
    setNote(r, v);
    window.scrollTo(0, y);
  };
  ne.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); finish(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
  });
  ne.addEventListener("blur", () => finish(true));
}

/* ══════════ 导入 / 导出（勾选 + 手写说明一起带走）══════════ */
function doExport() {
  const data = {
    app: "sikers-contract-ledger", version: 3,
    exportedAt: new Date().toISOString(), baseDate: D.today,
    picks: PICKS, notes: NOTES,
    snapshot: L.get(K_SNAP, null),
    ocr: L.get(K_OCR, null),
  };
  const name = `台账标注_${D.today}_勾选${pickCount()}条_说明${noteCount()}条.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return name;
}

/* 生成分享版：把当前勾选/手写说明/截图提取记录烧进一份完整 HTML，
   对方（或自己换浏览器）首次打开即带标注；不覆盖对方已有数据 */
function shareHtml() {
  const embed = { picks: PICKS, notes: NOTES, ocr: L.get(K_OCR, null) || {} };
  const doc = document.documentElement.cloneNode(true);
  const s = document.createElement("script");
  s.textContent = `window.__EMBED__=${JSON.stringify(embed).replace(/</g, "\\u003c")};`;
  const hd = doc.querySelector("head");
  hd.insertBefore(s, hd.firstChild);
  const desk = doc.querySelector("#desk");
  if (desk) desk.innerHTML = "";
  const html = "<!DOCTYPE html>\n" + doc.outerHTML;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `合同台账_分享版_${D.today}_勾选${pickCount()}条.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function doImport(obj) {
  let np = 0, nn = 0;
  const merge = (target, src) => {
    let c = 0;
    const list = Array.isArray(src)
      ? src.map((x, i) => ["legacy:" + ((x && x.n) || i), x])
      : Object.entries((src && typeof src === "object") ? src : {});
    for (const [k, rec] of list) {
      if (!rec || typeof rec !== "object") continue;
      const key = (k in target) ? k : k;
      const old = target[key];
      if (!old || (rec.ts || 0) >= (old.ts || 0)) { target[key] = rec; c++; }
    }
    return c;
  };
  np = merge(PICKS, obj.picks);
  nn = merge(NOTES, obj.notes);
  L.set(K_PICK, PICKS); L.set(K_NOTE, NOTES);
  if (obj.ocr) {
    const cur = L.get(K_OCR, null) || {};
    for (const [k, rec] of Object.entries(obj.ocr)) {
      if (!rec || typeof rec !== "object") continue;
      const old = cur[k];
      if (!old || (rec.ts || 0) >= (old.ts || 0)) cur[k] = rec;
    }
    L.set(K_OCR, cur);
  }
  rebind();
  return { np, nn };
}


/* ══════════ 截图提取记录（OCR → 关键字段 → 待登记记录）══════════ */
const ocrCount = () => Object.keys(L.get(K_OCR, null) || {}).length;

const DATES_RX = /(\d{4})\s*[年.\-\/]\s*(\d{1,2})\s*[月.\-\/]\s*(\d{1,2})/g;
const normDate = (y, m, d) => {
  y = +y; m = +m; d = +d;
  if (y < 2000 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
};
const cleanLine = s => s.replace(/[|｜_「」『』《》"'“”‘’、,，;；!！?？]/g, " ").replace(/\s+/g, " ").trim();

function extractFields(text0) {
  /* OCR 常在中文字间插空格（「甲 方」「2026 年」），先去掉中文之间的空白再解析 */
  const text = text0.replace(/(?<=[\u4e00-\u9fff\u3001-\u303f])[ \t]+(?=[\u4e00-\u9fff\u3001-\u303f])/g, "");
  const lines = text.split(/\n+/).map(x => x.trim()).filter(Boolean);
  const rec = { name: "", code: "", pa: "", pb: "", start: "", end: "", money: "", raw: text.trim() };

  /* 日期：优先认带关键词的行，没有就全文取最早/最晚 */
  const kwS = [], kwE = [], all = [];
  let m;
  DATES_RX.lastIndex = 0;
  while ((m = DATES_RX.exec(text))) { const d = normDate(m[1], m[2], m[3]); if (d) all.push(d); }
  for (const ln of lines) {
    const ds = [];
    DATES_RX.lastIndex = 0;
    while ((m = DATES_RX.exec(ln))) { const d = normDate(m[1], m[2], m[3]); if (d) ds.push(d); }
    if (!ds.length) continue;
    if (/生效|开始|起始|起止|自.{0,12}起/.test(ln)) kwS.push(ds[0]);
    if (/终止|到期|截止|届满|至.{0,12}止|止于/.test(ln)) kwE.push(ds[ds.length - 1]);
  }
  if (kwS.length) rec.start = [...new Set(kwS)].sort()[0];
  if (kwE.length) rec.end = [...new Set(kwE)].sort().pop();
  if (!rec.start && all.length) rec.start = [...new Set(all)].sort()[0];
  if (!rec.end && all.length > 1) rec.end = [...new Set(all)].sort().pop();

  for (const ln of lines) {
    const c = cleanLine(ln);
    if (!c) continue;
    if (!rec.pa && /^(甲方|发包方|委托方|甲方单位)[:：\s]/.test(c)) rec.pa = c.replace(/^(甲方|发包方|委托方|甲方单位)[:：\s]*/, "").slice(0, 40);
    if (!rec.pb && /^(乙方|承包方|受托方|服务方|乙方单位|供方|卖方)[:：\s]/.test(c)) rec.pb = c.replace(/^(乙方|承包方|受托方|服务方|乙方单位|供方|卖方)[:：\s]*/, "").slice(0, 40);
    if (!rec.code && /编号|合同号|No\.?[:：]/i.test(c)) {
      const cm = c.match(/[A-Za-z0-9\-—_\/（）()]{6,}/g);
      if (cm) rec.code = cm.filter(x => !/^\d{4}$/.test(x)).sort((a, b) => b.length - a.length)[0] || "";
    }
    if (!rec.money) {
      const mm = c.match(/(金额|总价|总费用|费用)[^\d]{0,6}[¥￥]?\s*([\d,，.]+)\s*万?元?/);
      if (mm) rec.money = mm[2] + (c.includes("万") ? " 万" : " 元");
    }
  }
  /* 名称：含「合同/协议」且不含甲乙方的行，取最短的那条（通常是标题） */
  const cand = lines.map(cleanLine)
    .filter(c => /合同|协议|约定|合作/.test(c) && !/甲方|乙方|编号|金额|签订|日期/.test(c))
    .sort((a, b) => a.length - b.length);
  if (cand.length) rec.name = cand[0].replace(/^(关于)?\s*/, "").slice(0, 42);
  return rec;
}

const matchLedger = rec => {
  if (!rec.name) return { ok: false, why: "没提取到名称" };
  const n1 = norm(rec.name);
  for (const r of D.rows) {
    const n2 = norm(r.name), s = sim(n1, n2);
    if (s >= 0.72 || (n1 && n2 && (n1.includes(n2) || n2.includes(n1))))
      return { ok: true, why: r.group + " · " + r.name.slice(0, 24) };
  }
  return { ok: false, why: "台账里暂时没有，可能要新登记" };
};

/* ── 弹窗状态 ── */
let OCR_WORKER = null, OCR_DRAFT = [];
const $om = document.getElementById("omodal");
const $olog = document.getElementById("olog");
const $orecs = document.getElementById("orecs");
const $ostat = document.getElementById("ostat");
const olog = (html) => { $olog.innerHTML += html + "<br>"; $olog.scrollTop = 1e6; };

async function getWorker() {
  if (OCR_WORKER) return OCR_WORKER;
  if (!window.Tesseract) {
    olog("首次使用，正在加载识别引擎（约 10MB，之后有缓存）…");
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = res; s.onerror = () => rej(new Error("引擎加载失败"));
      document.head.appendChild(s);
    });
  }
  OCR_WORKER = await Tesseract.createWorker("chi_sim+eng", 1, {
    logger: m => { if (m.status === "recognizing text") $ostat.textContent = `识别中 ${Math.round(m.progress * 100)}%…`; }
  });
  return OCR_WORKER;
}

async function ocrFiles(files) {
  const imgs = [...files].filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  let worker;
  try { worker = await getWorker(); }
  catch (_) { olog("<b style='color:#B4554A'>识别引擎加载失败：需要联网（第一次约 10MB）。检查网络后重试。</b>"); return; }
  for (const f of imgs) {
    olog(`<b>${ESC(f.name)}</b> 识别中…`);
    try {
      const { data } = await worker.recognize(f);
      const rec = extractFields(data.text || "");
      rec.img = f.name; rec.ts = Date.now() + Math.random();
      OCR_DRAFT.push(rec);
      drawDraft();
      const miss = [!rec.name && "名称", !rec.pb && "乙方", !rec.end && "到期日"].filter(Boolean);
      olog(`<b>${ESC(f.name)}</b> 完成 ✓${miss.length ? "　缺：" + miss.join("、") + "（可手动补）" : ""}`);
    } catch (err) {
      olog(`<b>${ESC(f.name)}</b> 识别失败：${ESC(String(err).slice(0, 60))}`);
    }
  }
  $ostat.textContent = "";
}

const DRAFT_ROW = (rec, i) => {
  const mt = matchLedger(rec);
  return `<div class="orec" data-i="${i}">
    <div class="h"><b>截图 ${i + 1} · ${ESC(rec.img || "")}</b>
      <span class="match ${mt.ok ? "yes" : "no"}">${mt.ok ? "✓ 台账已有：" : "⚠ "}${ESC(mt.why)}</span>
      <span class="x" data-del="${i}">移除</span></div>
    <div class="ogrid">
      <label class="full">合同名称<input data-k="name" value="${ESC(rec.name)}"></label>
      <label>甲方<input data-k="pa" value="${ESC(rec.pa)}"></label>
      <label>乙方<input data-k="pb" value="${ESC(rec.pb)}"></label>
      <label>生效日期<input data-k="start" placeholder="2026-01-01" value="${ESC(rec.start)}"></label>
      <label>到期日期<input data-k="end" placeholder="2027-12-31" value="${ESC(rec.end)}"></label>
      <label>合同编号<input data-k="code" value="${ESC(rec.code)}"></label>
      <label>金额（选填）<input data-k="money" value="${ESC(rec.money)}"></label>
    </div></div>`;
};
const drawDraft = () => {
  $orecs.innerHTML = OCR_DRAFT.map(DRAFT_ROW).join("");
  document.getElementById("osave").style.display = OCR_DRAFT.length ? "" : "none";
  $ostat.textContent = OCR_DRAFT.length ? `已提取 ${OCR_DRAFT.length} 条，核对无误后点「全部保存」` : "";
};

function openOmodal() { $om.classList.add("on"); }
function closeOmodal() {
  $om.classList.remove("on");
  OCR_DRAFT = []; $orecs.innerHTML = ""; $olog.innerHTML = "";
  document.getElementById("osave").style.display = "none";
  document.getElementById("ofile").value = "";
}

document.getElementById("ocrBtn").addEventListener("click", openOmodal);
document.getElementById("ocancel").addEventListener("click", closeOmodal);
$om.addEventListener("click", e => { if (e.target === $om) closeOmodal(); });
document.getElementById("odrop").addEventListener("click", () => document.getElementById("ofile").click());
document.getElementById("ofile").addEventListener("change", e => ocrFiles(e.target.files));
$om.addEventListener("dragover", e => { e.preventDefault(); document.getElementById("odrop").classList.add("drag"); });
$om.addEventListener("dragleave", () => document.getElementById("odrop").classList.remove("drag"));
$om.addEventListener("drop", e => {
  e.preventDefault(); document.getElementById("odrop").classList.remove("drag");
  ocrFiles(e.dataTransfer.files);
});
$om.addEventListener("paste", e => {
  const fs = [...(e.clipboardData || {}).items || []].filter(x => x.type.startsWith("image/")).map(x => x.getAsFile()).filter(Boolean);
  if (fs.length) { e.preventDefault(); ocrFiles(fs); }
});
$orecs.addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { OCR_DRAFT.splice(+del.dataset.del, 1); drawDraft(); }
});
document.getElementById("osave").addEventListener("click", () => {
  $orecs.querySelectorAll(".orec").forEach(box => {
    const rec = OCR_DRAFT[+box.dataset.i];
    if (!rec) return;
    box.querySelectorAll("input[data-k]").forEach(inp => { rec[inp.dataset.k] = inp.value.trim(); });
  });
  const store = L.get(K_OCR, null) || {};
  let n = 0;
  for (const rec of OCR_DRAFT) {
    if (!rec.name && !rec.pb) continue;
    const id = "o" + Date.now().toString(36) + (n++);
    delete rec.img;
    store[id] = rec;
  }
  L.set(K_OCR, store);
  closeOmodal(); rerender();
  setTimeout(() => { const s = document.querySelector(".sect.osec"); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
});

/* ══════════ 事件（统一委托，重渲染后依然有效）══════════ */
const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
const flash = (btn, txt) => {
  if (!btn) return;
  const old = btn.textContent;
  btn.textContent = txt; btn.classList.add("ok");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1800);
};

document.addEventListener("click", e => {
  /* 手写说明：点单元格进入编辑 */
  const nc = e.target.closest("[data-note]");
  if (nc && !e.target.closest(".ne")) { startEdit(nc); return; }

  /* 勾选重点跟进 */
  const pk = e.target.closest("[data-pick]");
  if (pk) {
    const r = byUid.get(pk.dataset.pick);
    if (r) togglePick(r);
    return;
  }

  /* 差异明细 / 只看新增 */
  if (e.target.closest("#tglDiff")) { diffOpen = !diffOpen; rerender(); return; }
  if (e.target.closest("#onlyNew")) {
    filter = "new";
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x.dataset.f === "new"));
    render(); window.scrollTo(0, 0);
    return;
  }

  /* 重点跟进：截图挑选 / 清空 / 清孤儿 */
  if (e.target.closest("#shotBtn")) {
    shotMode = !shotMode;
    SHOT_HIDE.clear();
    rerender();
    if (shotMode) {
      const sect = document.querySelector(".sect.pick");
      if (sect) sect.scrollIntoView({ block: "start", behavior: "smooth" });
    }
    return;
  }
  const sck = e.target.closest(".shotck");
  if (sck) {
    const u = sck.dataset.shot;
    if (sck.checked) SHOT_HIDE.delete(u); else SHOT_HIDE.add(u);
    rerender();
    return;
  }
  const uh = e.target.closest("[data-unhide]");
  if (uh) { SHOT_HIDE.delete(uh.dataset.unhide); rerender(); return; }
  if (e.target.closest("#unhideAll")) { SHOT_HIDE.clear(); rerender(); return; }
  if (e.target.closest("#clearPick")) {
    const n = pickCount();
    if (!n) return;
    if (!confirm(`确定清空全部 ${n} 条重点跟进吗？（不影响合同数据和手写说明）`)) return;
    PICKS = {}; L.set(K_PICK, PICKS); rebind(); rerender();
    return;
  }
  if (e.target.closest("#dropMiss")) {
    PICK_MISS.forEach(([k]) => delete PICKS[k]);
    NOTE_MISS.forEach(([k]) => delete NOTES[k]);
    L.set(K_PICK, PICKS); L.set(K_NOTE, NOTES); rebind(); rerender();
    return;
  }

  /* 📷 截图提取记录：看原文 / 删除 */
  const otg = e.target.closest("[data-otoggle]");
  if (otg) { otg.closest(".orecard").classList.toggle("open"); return; }
  const odl = e.target.closest("[data-odel]");
  if (odl) {
    const id = odl.closest(".orecard").dataset.oid;
    if (!confirm("删除这条截图提取记录？（台账里的合同不受影响）")) return;
    const store = L.get(K_OCR, null) || {};
    delete store[id]; L.set(K_OCR, store); rerender();
    return;
  }

  /* 导出 / 导入 / 分享版 */
  if (e.target.closest("#shareH")) {
    shareHtml();
    flash(e.target.closest("#shareH"), "已下载 ✓");
    return;
  }
  if (e.target.closest("#expAll")) {
    const name = doExport();
    flash(e.target.closest("#expAll"), "已下载 ✓");
    return;
  }
  if (e.target.closest("#impAll")) {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const obj = JSON.parse(fr.result);
          const { np, nn } = doImport(obj);
          alert(`导入完成：勾选 ${pickCount()} 条（本次读入 ${np}），手写说明 ${noteCount()} 条（本次读入 ${nn}）。`);
        } catch (err) {
          alert("这个文件读不出来，请选择用「导出」下载的 .json 文件。");
        }
        rerender();
      };
      fr.readAsText(f);
    };
    inp.click();
    return;
  }
});


document.getElementById("q").addEventListener("input", e => {
  kw = e.target.value.trim().toLowerCase();
  render();
});
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); filter = c.dataset.f; render();
}));

let t;
window.addEventListener("resize", () => {
  clearTimeout(t); t = setTimeout(render, 160);
});
render();
</script>
